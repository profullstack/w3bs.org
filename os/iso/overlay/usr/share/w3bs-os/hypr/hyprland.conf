# W3BS OS default Hyprland configuration (copied to ~/.config/hypr/hyprland.conf on the
# first login; edit that copy). Reference: https://wiki.hypr.land/Configuring/
#
#   SUPER+Return  terminal (foot)          SUPER+D        launcher (fuzzel)
#   SUPER+E       files (Thunar)           SUPER+B        browser (Firefox)
#   SUPER+Q       close window             SUPER+V        float / tile
#   SUPER+F       fullscreen               SUPER+L        lock
#   SUPER+1..0    workspace                SUPER+SHIFT+1..0  move window there
#   SUPER+arrows  focus                    SUPER+drag     move (left) / resize (right)
#   Print         screenshot of a region to ~/Pictures   SUPER+SHIFT+E  log out
#   SUPER+SHIFT+B TronBrowser (tronbrowser.dev)
#   SUPER+ALT+Escape  emergency stop: turn agent access off (Agentic Desktop Layer)

monitor = , preferred, auto, auto

$terminal = foot
$menu = fuzzel
$fileManager = thunar
$browser = firefox
$lock = swaylock -f -c 101418

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

exec-once = /usr/libexec/pipewire-launcher
exec-once = /usr/libexec/hyprpolkitagent
exec-once = waybar -s /usr/share/w3bs-os/hypr/waybar.css
exec-once = mako
exec-once = swayidle -w timeout 600 '$lock' before-sleep '$lock'
# The Agentic Desktop Layer: broker + tray (agent access stays OFF until you turn it on in
# the tray). Hyprland has no certified adapter yet: the broker reports what it can and cannot
# do. Log: ~/.local/state/w3bs-os/desktop-layer.log
exec-once = /usr/share/w3bs-os/hypr/desktop-layer.sh
# VM tweaks (software cursor, 1x scale: VMs report a 0x0 mm screen and auto picks 2x), the
# wallpaper (started after them, kept running) and the first-login welcome; a script, since Hyprland expands $variables in this file.
exec-once = /usr/share/w3bs-os/hypr/session-start.sh


general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(4f8cffee) rgba(36d399ee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

decoration {
    rounding = 8
    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
    blur {
        enabled = true
        size = 3
        passes = 1
    }
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    animation = global, 1, 6, default
    animation = windows, 1, 4, easeOutQuint
    animation = workspaces, 1, 3, easeOutQuint, fade
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = false
    }
}

gesture = 3, horizontal, workspace

$mod = SUPER
bind = $mod, Return, exec, $terminal
bind = $mod, D, exec, $menu
bind = $mod, E, exec, $fileManager
bind = $mod, B, exec, $browser
bind = $mod SHIFT, B, exec, tron
bind = $mod, Q, killactive,
bind = $mod, V, togglefloating,
bind = $mod, F, fullscreen,
bind = $mod, P, pseudo,
bind = $mod, J, layoutmsg, togglesplit
bind = $mod, L, exec, $lock
bind = $mod SHIFT, E, exit,
# The tray's own emergency-stop shortcut needs the GlobalShortcuts portal, which the wlr/gtk
# portals lack; bind the same keys (Super+Alt+Escape) here.
bind = $mod ALT, Escape, exec, /usr/local/bin/w3bs-desktop disable
bind = , Print, exec, mkdir -p ~/Pictures && grim -g "$(slurp)" ~/Pictures/screenshot-$(date +%F-%H%M%S).png

bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
