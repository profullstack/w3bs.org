# The live installer: tty1 logs in as root and offers the installer. live-config would
# replace this with an autologin of its own live user (live-config_autologin.conf, which sorts
# later): the ISO boots with live-config.noautologin.
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin root --noclear %I $TERM
