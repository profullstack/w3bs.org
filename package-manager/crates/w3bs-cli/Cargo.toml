[package]
name = "w3bs-cli"
description = "W3BS Package Manager: install from any participating website or with `w3bs install`, manage every package, update all with one command"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "w3bs"
path = "src/main.rs"

[dependencies]
w3bs-core.workspace = true
w3bs-schema.workspace = true
clap.workspace = true
semver.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "sync"] }
reqwest.workspace = true
sha2.workspace = true
url.workspace = true
aws-lc-rs.workspace = true
fs4.workspace = true
libc = "0.2"
futures.workspace = true
# Fleet screens (src/screen.rs): the agent's outbound WebSockets, TLS like reqwest's.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-platform-verifier = "0.7"

[dev-dependencies]
w3bs-publish = { path = "../w3bs-publish" }
tempfile.workspace = true
flate2.workspace = true
tar.workspace = true
hex.workspace = true
