[workspace]
resolver = "3"
members = ["crates/adl-schema", "crates/adl-broker", "crates/adl-linux", "crates/adl-macos", "crates/adl-windows", "crates/w3bs-desktop"]

[workspace.package]
version = "0.9.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/profullstack/w3bs.org"
homepage = "https://w3bs.org/desktop"
rust-version = "1.88"

[workspace.dependencies]
adl-schema = { path = "crates/adl-schema" }
adl-broker = { path = "crates/adl-broker" }
adl-linux = { path = "crates/adl-linux" }
adl-macos = { path = "crates/adl-macos" }
adl-windows = { path = "crates/adl-windows" }
base64 = "0.22"
clap = { version = "4.6", features = ["derive", "wrap_help", "env"] }
getrandom = "0.3"
hex = "0.4"
libc = "0.2"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tungstenite = { version = "0.27", default-features = false, features = ["handshake"] }
thiserror = "2"
windows = "0.62"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
