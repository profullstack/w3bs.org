[package]
name = "adl-macos"
description = "Agentic Desktop Layer: macOS adapter (Core Graphics events, CGWindowList, Accessibility, screen capture) and menu-bar helpers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[dependencies]
adl-schema.workspace = true
adl-broker.workspace = true

# Everything platform-specific is gated, so the workspace still builds and tests on Linux and
# Windows (the crate is then empty apart from the portable key map and its tests).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-foundation = "=0.3.2"
objc2-app-kit = "=0.3.2"
