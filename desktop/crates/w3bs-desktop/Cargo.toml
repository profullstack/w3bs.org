[package]
name = "w3bs-desktop"
description = "Agentic Desktop Layer: `w3bs desktop` CLI, local broker daemon, native controls and MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[lib]
name = "w3bs_desktop"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "w3bs-desktop"
path = "src/main.rs"

# The same program for the Windows GUI subsystem: runs the broker and tray at logon with no
# console window. Elsewhere it is identical to w3bs-desktop and is not shipped.
[[bin]]
name = "w3bs-desktopw"
path = "src/bin/w3bs-desktopw.rs"

[dependencies]
adl-schema.workspace = true
adl-broker.workspace = true
base64.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
adl-linux.workspace = true
ksni = { version = "0.3.6", default-features = false, features = ["blocking", "async-io"] }
zbus = "5.19"

[target.'cfg(target_os = "macos")'.dependencies]
adl-macos.workspace = true
objc2 = "=0.6.5"
objc2-foundation = "=0.3.2"
objc2-app-kit = "=0.3.2"

[target.'cfg(windows)'.dependencies]
adl-windows.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile.workspace = true
