# W3BS Training releases: on a `training-v*` tag, compile w3bs-training into one self-contained
# binary per platform (bun build --compile) and attach the archives plus SHA256SUMS to a GitHub
# release. https://w3bs.org/training/install.sh (Linux, macOS) and
# https://w3bs.org/training/install.ps1 (Windows) download from here and check SHA256SUMS.
name: Training release
on:
  push:
    tags: ['training-v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun test test/training.test.mjs test/training-surfaces.test.mjs test/training-recorder.test.mjs
      # Cross-compiles all five targets from this runner; fails if the tag and VERSION disagree.
      - run: sh training/packaging/build.sh "${GITHUB_REF_NAME#training-v}" dist
      # The Linux binary must run on its own, with no Bun beside it.
      - run: |
          mkdir -p smoke && tar -xzf dist/w3bs-training-*-x86_64-unknown-linux-gnu.tar.gz -C smoke
          env -i HOME="$RUNNER_TEMP" PATH=/usr/bin:/bin smoke/bin/w3bs-training version
          W3BS_TRAINING_HOME="$RUNNER_TEMP/th" W3BS_TRAINING_PASSPHRASE=ci smoke/bin/w3bs-training import - --filename t.zip < training/fixtures/recorder/teach.w3bs-training.zip
      - run: |
          ls -l dist
          test "$(ls dist/*.tar.gz dist/*.zip | wc -l)" -eq 5
          (cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS && cat SHA256SUMS)
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" \
            --title "W3BS Training ${GITHUB_REF_NAME#training-v}" \
            --notes "Install on Linux and macOS: \`curl -fsSL https://w3bs.org/training/install.sh | sh\`. On Windows (PowerShell): \`irm https://w3bs.org/training/install.ps1 | iex\`. One self-contained binary, no Bun or Node needed. The Agentic Desktop Layer's recorder (tray: Start training…) hands recordings to it. Docs: https://github.com/profullstack/w3bs.org/tree/main/docs/training. Binaries are not code-signed." \
            || gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
