name: Agentic Desktop Layer
on:
  push:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      # Broker conformance (mock adapter), Vela adapter against a fake command socket,
      # and the end-to-end daemon + control + CLI + MCP test.
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --release --locked -p w3bs-desktop
      # Browser channel against the runner's real Chrome over DevTools.
      - run: sh tests/rig/browser-cdp.sh
        env:
          CHROME: google-chrome
          W3BS_DESKTOP_BIN: target/release/w3bs-desktop
      - uses: actions/upload-artifact@v4
        with:
          name: w3bs-desktop-linux-x86_64-unsigned
          path: desktop/target/release/w3bs-desktop
  # The Alpine (musl) installer end to end on both architectures: build the static musl binary
  # exactly as the release workflow does, package it, and run packaging/install.sh in an
  # alpine:3.24 container (tests/installer/alpine.sh): musl detection, no-systemd autostart,
  # the printed apk line, and the broker starting Disabled.
  installer-alpine:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
          key: installer-${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - run: cargo install --locked cargo-zigbuild@0.23.4 && cargo zigbuild --locked --release --target ${{ matrix.target }} -p w3bs-desktop
      - name: Package (as the release workflow does)
        run: |
          v=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          echo "VERSION=$v" >> "$GITHUB_ENV"
          sh packaging/package.sh ${{ matrix.target }} "$v" dist
      - name: Install and verify in alpine:3.24
        run: docker run --rm -v "$PWD:/w" -w /w alpine:3.24 sh tests/installer/alpine.sh "dist/w3bs-desktop-$VERSION-${{ matrix.target }}.tar.gz" "$VERSION"
  # The portable crates and the CLI on real macOS and Windows runners (mock adapter; the native
  # backends add their own end-to-end jobs).
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - run: cargo test --locked -p adl-schema -p adl-broker -p w3bs-desktop
      - run: cargo clippy --locked -p adl-schema -p adl-broker -p w3bs-desktop --all-targets -- -D warnings
  # The macOS backend end to end in the runner's logged-in GUI session: CGEvent input,
  # CGWindowList windows/focus/occlusion, Accessibility inspect, screen capture, the menu-bar
  # control and its emergency-stop hot key. See desktop/tests/rig/macos-e2e.sh.
  macos-e2e:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - run: cargo clippy --locked -p adl-macos -p w3bs-desktop --all-targets -- -D warnings
      - run: cargo test --locked -p adl-macos
      - run: cargo build --release --locked -p w3bs-desktop
      - run: tests/rig/macos-e2e.sh
        timeout-minutes: 15
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-e2e-logs
          path: ${{ runner.temp }}/adl-mac
          if-no-files-found: ignore
  # The Windows native backend on a real interactive desktop: SendInput, window discovery and
  # occlusion, GDI capture, UI Automation, session events, the emergency hotkey, named pipes and
  # the notification-area tray, driven through the release binary (tests/windows/e2e-native.ps1).
  windows-native:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - run: cargo clippy --locked -p adl-windows -p w3bs-desktop --all-targets -- -D warnings
      # Named-pipe transport (concurrent read/write, first-instance, peer SID), the mock-adapter
      # end-to-end over named pipes, and the portable mapping tests.
      - run: cargo test --locked -p adl-windows -p w3bs-desktop
      - run: cargo build --release --locked -p w3bs-desktop
      - name: Native end-to-end on the runner's desktop session
        shell: pwsh
        run: ./tests/windows/e2e-native.ps1 -Work "$env:RUNNER_TEMP\adl-e2e"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-e2e-logs
          path: ${{ runner.temp }}/adl-e2e
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: w3bs-desktop-windows-x86_64-unsigned
          path: desktop/target/release/w3bs-desktop.exe
  # The macOS installer end to end: package a release build exactly as the release workflow does,
  # run packaging/install.sh on it (local archive + checksum override), then check the
  # LaunchAgents, the launchd-run broker, the menu bar, crash restart, re-install and uninstall
  # (tests/installer/macos.sh).
  installer-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
          key: installer-aarch64-apple-darwin
      - run: cargo build --locked --release --target aarch64-apple-darwin -p w3bs-desktop
      - name: Package (as the release workflow does)
        run: |
          v=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          echo "VERSION=$v" >> "$GITHUB_ENV"
          sh packaging/package.sh aarch64-apple-darwin "$v" "$RUNNER_TEMP/dist"
      - name: Install, verify, uninstall
        run: tests/installer/macos.sh "$RUNNER_TEMP/dist/w3bs-desktop-$VERSION-aarch64-apple-darwin.tar.gz" "$VERSION"
      # The Intel release row is a cross build on Apple silicon; prove it builds and packages.
      - name: Release build and package for x86_64-apple-darwin
        run: |
          cargo build --locked --release --target x86_64-apple-darwin -p w3bs-desktop
          sh packaging/package.sh x86_64-apple-darwin "$VERSION" "$RUNNER_TEMP/dist-x86"
          file target/x86_64-apple-darwin/release/w3bs-desktop
          arch -x86_64 target/x86_64-apple-darwin/release/w3bs-desktop --version || echo "Rosetta not available on this runner; not run"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: installer-macos-logs
          path: |
            ${{ runner.temp }}/installer-mac
            ~/Library/Logs/w3bs-desktop
          if-no-files-found: ignore
  # The Windows installer end to end: package the release build (console CLI + GUI-subsystem
  # w3bs-desktopw.exe) as the release workflow does, run packaging/install.ps1 under Windows
  # PowerShell 5.1 on it, then check autostart, the windowless broker and tray (no conhost),
  # status, re-install and uninstall (tests/installer/windows.ps1).
  installer-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
          key: installer-x86_64-pc-windows-msvc
      - run: cargo build --locked --release --target x86_64-pc-windows-msvc -p w3bs-desktop
      - name: Package (as the release workflow does)
        shell: bash
        run: |
          v=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          echo "VERSION=$v" >> "$GITHUB_ENV"
          sh packaging/package.sh x86_64-pc-windows-msvc "$v" "$RUNNER_TEMP/dist"
      - name: Install, verify, uninstall
        shell: pwsh
        run: ./tests/installer/windows.ps1 -Archive "$env:RUNNER_TEMP\dist\w3bs-desktop-$env:VERSION-x86_64-pc-windows-msvc.zip" -Version $env:VERSION -Work "$env:RUNNER_TEMP\installer-win"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows-logs
          path: |
            ${{ runner.temp }}/installer-win
            ~/AppData/Local/w3bs/desktop/state/logs
          if-no-files-found: ignore
