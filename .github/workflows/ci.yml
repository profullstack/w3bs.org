name: Conformance
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: w3bs
          POSTGRES_DB: w3bs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Registry tests run against SQLite and, with this set, PostgreSQL as well.
      W3BS_TEST_DATABASE_URL: postgres://postgres:w3bs@127.0.0.1:5432/w3bs
    steps:
      - uses: actions/checkout@v4
      # The version comes from packageManager in package.json, the same Bun the
      # Dockerfile pins.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: bun run conformance
      # The production entrypoint must boot under Bun against PostgreSQL and answer.
      - name: Server answers under Bun
        env:
          DATABASE_URL: ${{ env.W3BS_TEST_DATABASE_URL }}
          PORT: 3000
          HOST: 127.0.0.1
          PUBLIC_ORIGIN: http://127.0.0.1:3000
        run: |
          bun src/bootstrap.mjs > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/healthz; then
              echo
              curl -sf -o /dev/null -w '/ -> %{http_code}\n' http://127.0.0.1:3000/
              exit 0
            fi
            sleep 1
          done
          cat /tmp/server.log; exit 1
      # Playwright's test runner stays on the runner's Node; the server it
      # starts (playwright.config.mjs webServer) runs under Bun.
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-evidence
          path: |
            fixtures/conformance-report.json
            artifacts/
            test-results/
  audit:
    name: bun audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Dependency audit
        continue-on-error: true
        run: bun audit --audit-level=critical
