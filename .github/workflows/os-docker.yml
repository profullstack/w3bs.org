# W3BS OS Docker editions (docs/os-prd.md §20): ghcr.io/profullstack/w3bs-os:{server,desktop}.
# Pull requests build and smoke-test the server image; main builds both images natively on
# amd64 and arm64, pushes them by digest, joins each into one multi-arch tag and signs it
# (cosign keyless, GitHub OIDC). The desktop image's agent check needs vkms, which hosted
# runners lack; run os/docker/check-desktop.sh on a host that has it.
name: W3BS OS images
on:
  push:
    branches: [main]
    paths: ['os/docker/**', 'desktop/crates/**', 'desktop/Cargo.*', 'package-manager/crates/**', 'package-manager/Cargo.*', 'registry/FINGERPRINT', '.github/workflows/os-docker.yml']
  pull_request:
    paths: ['os/docker/**', 'desktop/crates/**', 'desktop/Cargo.*', 'package-manager/crates/**', 'package-manager/Cargo.*', 'registry/FINGERPRINT', '.github/workflows/os-docker.yml']
  workflow_dispatch:
permissions:
  contents: read
# One publish per ref, newest push wins. Without it two pushes 27 s apart (2026-10-19) built
# side by side and the OLDER commit finished last, re-tagging :server with w3bs 0.1.13 over
# 0.1.14 for ~13 min: `w3bs dist-upgrade` was an unknown command in a freshly pulled image.
concurrency:
  group: os-docker-${{ github.ref }}
  cancel-in-progress: true
env:
  IMAGE: ghcr.io/profullstack/w3bs-os
jobs:
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the server image
        run: docker buildx build -f os/docker/Dockerfile --target server -t w3bs-os:server --load .
      - name: w3bs runs, the official repository is pinned, and a catalog tool installs
        run: |
          docker run --rm w3bs-os:server zsh -lc '
            set -e
            w3bs --version
            w3bs repo list | grep -q "$(cat /usr/share/w3bs-os/FINGERPRINT)"
            w3bs install hqtui --yes >/dev/null
            hqtui --version'
      - name: the shell keeps history and Up walks it
        run: |
          docker run --rm -t w3bs-os:server zsh -lic '
            set -e
            [[ $HISTFILE == $HOME/.zsh_history && $SAVEHIST -ge 10000 ]]
            [[ $(bindkey "^[[A") == *up-line-or-beginning-search ]]
            [[ $(bindkey "^[OA") == *up-line-or-beginning-search ]]
            print -s "w3bs update"; fc -W
            grep -q "w3bs update" $HISTFILE'

  build:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [server, desktop]
        platform:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: os/docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.platform.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.platform.arch }}
      - name: Record the digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          echo "${{ steps.build.outputs.digest }}" > "$RUNNER_TEMP/digests/${{ matrix.platform.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.target }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        target: [server, desktop]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.target }}-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
      - name: Tag the multi-arch image and sign it
        run: |
          short=$(echo "$GITHUB_SHA" | cut -c1-7)
          refs=$(for f in digests/*; do printf '%s@%s ' "$IMAGE" "$(cat "$f")"; done)
          docker buildx imagetools create -t "$IMAGE:${{ matrix.target }}" -t "$IMAGE:${{ matrix.target }}-$short" $refs
          digest=$(docker buildx imagetools inspect "$IMAGE:${{ matrix.target }}" --format '{{.Manifest.Digest}}')
          cosign sign --yes "$IMAGE@$digest"
          echo "$IMAGE:${{ matrix.target }} = $IMAGE@$digest (signed)" >> "$GITHUB_STEP_SUMMARY"

  # GHCR packages of this org stay private (org policy), so the images are also served from
  # w3bs.org (`docker pull w3bs.org/os:server`, src/registry-front.mjs): every manifest and
  # blob is copied into the public release `os-images` as `sha256-<hex>`, with tags.json
  # mapping each tag to its index digest.
  mirror:
    needs: publish
    runs-on: ubuntu-latest
    concurrency: os-images-mirror
    permissions:
      contents: write
      packages: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: imjasonh/setup-crane@v0.4
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | crane auth login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Copy manifests and blobs into the os-images release
        run: |
          set -euo pipefail
          gh release view os-images >/dev/null 2>&1 || gh release create os-images --latest=false \
            --title "W3BS OS images (registry store)" \
            --notes "Blobs and manifests behind docker pull w3bs.org/os:<tag> (served by w3bs.org/v2/). Not a software release."
          gh release view os-images --json assets -q '.assets[].name' > have.txt || true
          mkdir -p out
          put() { # digest, file
            name="${1/:/-}"
            grep -qx "$name" have.txt && return 0
            mv "$2" "out/$name" && gh release upload os-images "out/$name" && echo "$name" >> have.txt && rm -f "out/$name"
          }
          gh release download os-images --pattern tags.json --output tags.json 2>/dev/null || echo '{}' > tags.json
          for tag in server desktop; do
            index=$(crane digest "$IMAGE:$tag")
            crane manifest "$IMAGE@$index" > m.json && put "$index" m.json
            for child in $(crane manifest "$IMAGE@$index" | jq -r '.manifests[].digest'); do
              crane manifest "$IMAGE@$child" > m.json && put "$child" m.json
              for blob in $(crane manifest "$IMAGE@$child" | jq -r '.config.digest, .layers[].digest'); do
                grep -qx "${blob/:/-}" have.txt || { crane blob "$IMAGE@$blob" > b.bin && put "$blob" b.bin; }
              done
            done
            jq --arg t "$tag" --arg d "$index" '.[$t] = $d' tags.json > t.json && mv t.json tags.json
            echo "w3bs.org/os:$tag -> $index" >> "$GITHUB_STEP_SUMMARY"
          done
          gh release upload os-images tags.json --clobber
