# Agentic Desktop Layer releases: on a `desktop-v*` tag, build w3bs-desktop for every platform
# whose backend is real, and attach the archives plus SHA256SUMS to a GitHub release.
# https://w3bs.org/desktop/install.sh (Linux, macOS) and https://w3bs.org/desktop/install.ps1
# (Windows) download from here and check SHA256SUMS.
name: Desktop release
on:
  push:
    tags: ['desktop-v*']
permissions:
  contents: read
defaults:
  run:
    working-directory: desktop
jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          # glibc 2.28 baseline so the binary runs on every supported distro.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, zig: x86_64-unknown-linux-gnu.2.28 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, container: 'quay.io/pypa/manylinux_2_28_aarch64' }
          # macOS 11 baseline; both architectures built on Apple silicon.
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-14, target: x86_64-apple-darwin }
          # Console CLI plus the GUI-subsystem w3bs-desktopw.exe for the broker and tray.
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
      - if: matrix.container
        run: |
          curl --proto '=https' -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - if: '!matrix.container'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
          key: ${{ matrix.target }}
      - if: matrix.zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - if: matrix.zig
        run: cargo install --locked cargo-zigbuild@0.19.8 && cargo zigbuild --locked --release --target ${{ matrix.zig }} -p w3bs-desktop
      - if: '!matrix.zig'
        run: cargo build --locked --release --target ${{ matrix.target }} -p w3bs-desktop
      - name: Package
        shell: bash
        run: sh packaging/package.sh "${{ matrix.target }}" "${GITHUB_REF_NAME#desktop-v}" "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: w3bs-desktop-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/dist/*.tar.gz
            ${{ runner.temp }}/dist/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: (cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS && cat SHA256SUMS)
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "Agentic Desktop Layer ${GITHUB_REF_NAME#desktop-v}" \
            --notes "Install on Linux and macOS: \`curl -fsSL https://w3bs.org/desktop/install.sh | sh\`. On Windows (PowerShell): \`irm https://w3bs.org/desktop/install.ps1 | iex\`. Agent access starts Disabled. Docs: https://w3bs.org/desktop. Binaries are not code-signed. No platform is certified yet." \
            || gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
