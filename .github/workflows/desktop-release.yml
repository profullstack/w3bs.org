# Agentic Desktop Layer releases: on a `desktop-v*` tag, build w3bs-desktop for every platform
# whose backend is real, and attach the archives plus SHA256SUMS to a GitHub release.
# https://w3bs.org/desktop/install.sh downloads from here and checks SHA256SUMS.
name: Desktop release
on:
  push:
    tags: ['desktop-v*']
permissions:
  contents: read
defaults:
  run:
    working-directory: desktop
jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          # glibc 2.28 baseline so the binary runs on every supported distro.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, zig: x86_64-unknown-linux-gnu.2.28 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, container: 'quay.io/pypa/manylinux_2_28_aarch64' }
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v4
      - if: matrix.container
        run: |
          curl --proto '=https' -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - if: '!matrix.container'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
          key: ${{ matrix.target }}
      - if: matrix.zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - if: matrix.zig
        run: cargo install --locked cargo-zigbuild@0.19.8 && cargo zigbuild --locked --release --target ${{ matrix.zig }} -p w3bs-desktop
      - if: '!matrix.zig'
        run: cargo build --locked --release --target ${{ matrix.target }} -p w3bs-desktop
      - name: Package
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#desktop-v}"
          d="$RUNNER_TEMP/pkg"; mkdir -p "$d/bin" "$d/share"
          cp "target/${{ matrix.target }}/release/w3bs-desktop" "$d/bin/"
          cp LICENSE README.md "$d/"
          cp -r packaging "$d/share/"
          tar -czf "$RUNNER_TEMP/w3bs-desktop-$v-${{ matrix.target }}.tar.gz" -C "$d" .
          ls -l "$RUNNER_TEMP"/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: w3bs-desktop-${{ matrix.target }}
          path: ${{ runner.temp }}/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: (cd dist && sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS)
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "Agentic Desktop Layer ${GITHUB_REF_NAME#desktop-v}" \
            --notes "Install: \`curl -fsSL https://w3bs.org/desktop/install.sh | sh\`. Agent access starts Disabled. Docs: https://w3bs.org/desktop. No platform is certified yet." \
            || gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
