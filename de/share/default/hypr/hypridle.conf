# W3BS DE idle: dim, lock, screen off. `w3bs-de agent-mode on` stops this while agents work
# unattended (the lock would pause them); `w3bs-de agent-mode off` starts it again.
general {
    lock_cmd = pidof hyprlock || hyprlock --config @W3BS_DE_SHARE@/default/hypr/hyprlock.conf
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 30%
    on-resume = brightnessctl -r
}
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}
listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
