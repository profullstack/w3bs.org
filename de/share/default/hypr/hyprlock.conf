# W3BS DE lock screen.
general {
    hide_cursor = true
    grace = 0
}
background {
    monitor =
    path = @W3BS_DE_SHARE@/wallpaper/w3bs-dark.png
    color = rgb(1c2b26)
}
label {
    monitor =
    text = cmd[update:30000] date +"%H:%M"
    color = rgb(f6f4ed)
    font_size = 72
    font_family = Georgia, serif
    position = 0, 160
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    outer_color = rgb(d95231)
    inner_color = rgb(1c2b26)
    font_color = rgb(f6f4ed)
    check_color = rgb(678c4f)
    fail_color = rgb(d95231)
    placeholder_text = Password
    fade_on_empty = false
    rounding = 6
    position = 0, -40
    halign = center
    valign = center
}
