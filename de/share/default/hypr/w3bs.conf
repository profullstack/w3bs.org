# W3BS DE defaults for Hyprland before 0.55 (hyprlang). https://w3bs.org/de
# Hyprland 0.55 and later load w3bs.lua instead. Do not edit: `w3bs-de update` replaces this file.
# Your settings go in ~/.config/w3bs-de/hypr/user.conf, sourced after this one.

$share = @W3BS_DE_SHARE@
$d = $share/default
$terminal = w3bs-de terminal
$launcher = fuzzel --config=$d/fuzzel/fuzzel.ini

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,w3bs-de
env = W3BS_DE,1
env = W3BS_DE_SHARE,$share
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

monitor = , preferred, auto, auto

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgb(d95231)
    col.inactive_border = rgba(6b726899)
    resize_on_border = true
    layout = dwindle
    allow_tearing = false
}
decoration {
    rounding = 6
    shadow {
        enabled = false
    }
    blur {
        enabled = false
    }
}
animations {
    enabled = true
    bezier = w3bs, 0.2, 1, 0.3, 1
    animation = global, 1, 4, w3bs
    animation = windows, 1, 2.5, w3bs, popin 92%
    animation = fade, 1, 2.5, w3bs
    animation = workspaces, 0
}
dwindle {
    preserve_split = true
    force_split = 2
}
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
    }
}
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = rgb(1c2b26)
    focus_on_activate = true
    allow_session_lock_restore = true
}
ecosystem {
    no_update_news = true
    no_donation_nag = true
}
xwayland {
    force_zero_scaling = true
}

windowrule = match:class ^(pavucontrol|nm-connection-editor|blueman-manager|org.pulseaudio.pavucontrol)$, float on
windowrule = match:class ^(hyprpolkitagent|polkit.*|gcr-prompter|pinentry.*)$, float on, center on, pin on
windowrule = match:title ^(Agentic Desktop Layer.*)$, float on

bind = SUPER, RETURN, exec, $terminal
bind = SUPER, SPACE, exec, $launcher
bind = SUPER, B, exec, xdg-open https://w3bs.org
bind = SUPER, N, exec, swaync-client -t -sw
bind = SUPER, W, killactive
bind = SUPER, Q, killactive
bind = SUPER, T, togglefloating
bind = SUPER, F, fullscreen, 0
bind = SUPER, J, layoutmsg, togglesplit
bind = SUPER, ESCAPE, exec, hyprlock --config $d/hypr/hyprlock.conf
bind = SUPER SHIFT, ESCAPE, exec, w3bs-de logout
bind = , PRINT, exec, w3bs-de screenshot region
bind = SHIFT, PRINT, exec, w3bs-de screenshot screen
bind = SUPER, LEFT, movefocus, l
bind = SUPER, RIGHT, movefocus, r
bind = SUPER, UP, movefocus, u
bind = SUPER, DOWN, movefocus, d
bind = SUPER SHIFT, LEFT, swapwindow, l
bind = SUPER SHIFT, RIGHT, swapwindow, r
bind = SUPER SHIFT, UP, swapwindow, u
bind = SUPER SHIFT, DOWN, swapwindow, d
bind = SUPER, code:10, workspace, 1
bind = SUPER, code:11, workspace, 2
bind = SUPER, code:12, workspace, 3
bind = SUPER, code:13, workspace, 4
bind = SUPER, code:14, workspace, 5
bind = SUPER, code:15, workspace, 6
bind = SUPER, code:16, workspace, 7
bind = SUPER, code:17, workspace, 8
bind = SUPER, code:18, workspace, 9
bind = SUPER SHIFT, code:10, movetoworkspace, 1
bind = SUPER SHIFT, code:11, movetoworkspace, 2
bind = SUPER SHIFT, code:12, movetoworkspace, 3
bind = SUPER SHIFT, code:13, movetoworkspace, 4
bind = SUPER SHIFT, code:14, movetoworkspace, 5
bind = SUPER SHIFT, code:15, movetoworkspace, 6
bind = SUPER SHIFT, code:16, movetoworkspace, 7
bind = SUPER SHIFT, code:17, movetoworkspace, 8
bind = SUPER SHIFT, code:18, movetoworkspace, 9
bind = SUPER, TAB, workspace, m+1
bind = SUPER SHIFT, TAB, workspace, m-1
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

bind = SUPER, A, exec, w3bs-desktop control --open
bind = SUPER SHIFT, A, togglespecialworkspace, agent
bind = SUPER ALT, A, movetoworkspacesilent, special:agent
bind = SUPER ALT, ESCAPE, exec, w3bs-desktop disable

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

exec-once = dbus-update-activation-environment --systemd --all
exec-once = w3bs-de autostart
